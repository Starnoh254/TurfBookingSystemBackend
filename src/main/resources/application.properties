spring.application.name=turfBookingSystemBackend

# Database Connection
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/turf_booking_system}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
# Later , change the ddl-auto to none and use migration tools like Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

